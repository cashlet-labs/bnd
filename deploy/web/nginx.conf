# nginx for the BND page: serves the built single-page app with its security
# headers and forwards the verifier's routes, so page and verifier share one
# origin. Runs unprivileged on port 8080 with a read-only root file system.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # No access log: it would record visitors' addresses.
    access_log off;
    sendfile on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 64k;

    upstream verifier {
        server verifier:8787;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;

        # The verifier's routes. X-Real-Ip comes from Traefik, which replaces
        # any value a client sends; the verifier trusts it for rate limits.
        location ~ ^/(challenge|login|me|logout)$ {
            proxy_pass http://verifier;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-Ip $http_x_real_ip;
            proxy_read_timeout 30s;
        }

        # Hashed build files never change.
        location /assets/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # Everything else is a route of the app: serve index.html, and let the
        # browser check for a new version each time.
        location / {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri /index.html;
        }
    }
}
