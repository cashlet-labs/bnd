# The hosted BND demo: the page (nginx) and the demo verifier.
#
#   VPS:   docker compose --env-file site.env -f compose.yaml -f compose.traefik.yaml up -d --build
#   Local: deploy/scripts/test-deploy.sh
#
# Settings come from site.env. See docs/deploy.md.

name: bnd-core

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  web:
    <<: *hardening
    image: bnd-core/web
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
      args:
        VITE_RELAYS: ${SITE_RELAYS:?set SITE_RELAYS in site.env}
        VITE_RELAYS_LABEL: ${SITE_RELAYS_LABEL:?set SITE_RELAYS_LABEL in site.env}
    tmpfs:
      - /tmp:size=16m
    mem_limit: 128m
    depends_on:
      verifier:
        condition: service_healthy

  verifier:
    <<: *hardening
    image: bnd-core/verifier
    build:
      context: ..
      dockerfile: deploy/verifier/Dockerfile
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-https://${SITE_HOST:?set SITE_HOST in site.env}}
      BND_RELAYS: ${VERIFIER_RELAYS:?set VERIFIER_RELAYS in site.env}
      BND_MIN_RELAYS: ${VERIFIER_MIN_RELAYS:-2}
      # nginx passes on Traefik's X-Real-Ip; nothing else can reach the verifier.
      BND_CLIENT_IP_HEADER: x-real-ip
    mem_limit: 256m
